<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div style="text-align: center; background-color: #2a2626">
    <h2>Asistencia</h2>
  </div>

  <ion-content class="ion-padding ion-text-center">
    <div style="background-color: #2a2626; padding: 10px; border-radius: 10px">
      <ion-segment [(ngModel)]="segment" mode="ios">
        <ion-segment-button value="scan">
          <ion-label>scan qr</ion-label>
        </ion-segment-button>
        <ion-segment-button value="generate">
          <ion-label>generar qr</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <!--segments-->
    <div class="segment" *ngIf="segment === 'scan'">
      <div class="segment-content">
        <img src="Prueba\src\assets\icon\scan_qr_icon.jpg" alt="" />

        
          
          <ion-button (click)="startScan()" class="submit" expand="block">
            Escanear
            <ion-icon slot="end" name="scan-outline"></ion-icon>
          </ion-button>
          
        

        
      </div>
    </div>

    <div class="segment" *ngIf="segment === 'generate'">
      <div class="segment-content">
        <div id="qrImage">
          <div class="d-flex-center">
            <div class="d-flex-center qr-wrapper">
              <qr-code [value]="qrText" size="190" errorCorrectionLevel="M" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="capturedImage">
      <img [src]="capturedImage" alt="Imagen capturada" />
    </div>

    <ion-content>
      <ion-grid>
        <ion-row>
          <ion-col>
            <div class="table-container">
              <h2 class="table-title">Asistencia</h2>
              <table>
                <thead>
                  <tr>
                    <th>rut</th>
                    <th>nombre</th>
                    <th>apellido</th>
                    <th>asistencia</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let post of posts">
                    <td>{{ post.rut }}</td>
                    <td>{{ post.nombre }}</td>
                    <td>{{ post.apellido }}</td>
                    <td>{{ post.asistencia }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-content>
  </ion-content>
</ion-content>

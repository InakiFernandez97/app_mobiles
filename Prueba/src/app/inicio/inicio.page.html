<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div>
    <ion-card *ngIf="">
      <h1></h1>
    </ion-card>
  </div>
  <ion-card>
    <ion-card-content>
      <div>
        <h1>bienvenido {{user}}</h1>
      </div>

      <ion-card-content id="menu_opciones">
        <h4>¿Que desea hacer?</h4>
        <ion-grid>
          <ion-row>
            <ion-col>
              <ion-button color="primary" (click)="registrarAsistencia()"
                >Registrar Asistencia</ion-button
              >
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card-content>
  </ion-card>
 
  <ion-content>
    <ion-grid>
      <ion-row>
        <ion-col>
          <div class="table-container">
          <h2 class="table-title">Asistencia</h2>
          <table>
            <thead>
              <tr>
                <th>rut</th>
                <th>nombre</th>
                <th>apellido</th>
                <th>asistencia</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let post of posts">
                <td>{{ post.rut }}</td>
                <td>{{ post.nombre }}</td>
                <td>{{ post.apellido }}</td>
                <td>{{ post.asistencia }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</ion-content>
